name: fix-code-style

on:
  push:
    paths:
      - '**.php'

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pint
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix code style
